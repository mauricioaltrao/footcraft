# Dados do pacote Linux; lidos por ~/.config/linux-build/package.sh
APP_ID=com.altrao.footcraft
APP_NAME="FootCraft"
BINARY=footcraft
PACKAGE=footcraft
COMMENT="Editor para a controladora MIDI Behringer FCB1010 (app independente, sem vínculo com a Behringer)"
CATEGORIES="AudioVideo;Audio;Music;"
ICON=packaging/linux/icon-512.png
MAINTAINER="Mauricio Altrao Rodrigues"
# libdartjni só serve ao Android; no Linux pede um libjvm que o usuário não terá.
REMOVE_LIBS="libdartjni.so"
DEB_DEPENDS="libgtk-3-0, libegl1, libgles2, libgl1-mesa-dri, libasound2t64 | libasound2"
RPM_REQUIRES="gtk3 mesa-libEGL mesa-dri-drivers libglvnd-gles alsa-lib"
