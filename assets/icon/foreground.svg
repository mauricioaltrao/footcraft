<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pedal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A818C"/>
      <stop offset="0.12" stop-color="#4A4F57"/>
      <stop offset="1" stop-color="#25282D"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3238"/>
      <stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- LED aceso -->
  <circle cx="512" cy="300" r="120" fill="url(#glow)"/>
  <circle cx="512" cy="300" r="40" fill="#FF3B30"/>
  <circle cx="500" cy="288" r="13" fill="#FFC2BD"/>
  <!-- pedal -->
  <g filter="url(#shadow)">
    <rect x="262" y="410" width="500" height="330" rx="44" fill="url(#pedal)" stroke="#9AA1AB" stroke-width="6"/>
    <rect x="300" y="452" width="424" height="250" rx="28" fill="url(#rubber)"/>
  </g>
  <!-- ranhuras da borracha, em âmbar como os valores no app -->
  <rect x="340" y="490" width="200" height="26" rx="13" fill="#FFB020"/>
  <rect x="340" y="560" width="300" height="26" rx="13" fill="#FFB020" opacity="0.85"/>
  <rect x="340" y="630" width="140" height="26" rx="13" fill="#FFB020" opacity="0.7"/>
</svg>
